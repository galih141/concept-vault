<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="binder">

  <!-- Left rail: category tabs -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <span class="rail-head-label">Collections</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Categories">
      <!-- tabs injected by app.js -->
    </nav>
  </aside>

  <!-- Main sheet -->
  <main class="sheet">
    <header class="sheet-header">
      <h1 class="title" id="pageTitle">CONCEPT VAULT</h1>
      <div class="crumbs" id="crumbs"></div>
    </header>

    <div class="sheet-body" id="sheetBody">
      <div class="state-msg" id="stateMsg">Loading your archive…</div>
      <div class="folder-grid" id="folderGrid" hidden></div>
      <div class="image-grid" id="imageGrid" hidden></div>
    </div>
  </main>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8592;</button>
  <figure class="lb-figure">
    <img id="lbImage" alt="">
    <figcaption id="lbCaption"></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8594;</button>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
